# dsh-auto-open-web bundle 配置层(随包分发,由 dsh.profile.bundles 应用)。
# 插件行按包名引用,Node 从 profile 的 node_modules 解析安装后的代码。
- insert:
    - id: auto-open-web
      name: dsh-auto-open-web

# 本插件用独立应用窗口打开 GUI,替代 DSH 核心(web-app bundle)启动后的
# 默认浏览器交接,避免同时弹出普通浏览器页面(核心的 openBrowser 默认 true,
# 会以普通标签页/窗口打开 GUI;插件窗口才是"独立应用窗口")。
# 补丁按 id 整体替换 config,故逐键重述 web-runtime 原配置,仅把
# openBrowser 置为 false(trustedHosts 保留 webStartup 提供的原表达式)。
# openBrowser 关闭后打开行为由插件全权接管:appWindow: true → 独立应用窗口;
# appWindow: false → 插件执行与官方核心相同的默认浏览器交接(open 包 →
# 平台原生拉起,普通标签页),行为与未安装本插件时一致。
- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
